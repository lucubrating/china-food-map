# Create a GitHub release when a version tag such as v1.2.0 is pushed.
# Title: the version without its "v", then the first line of the tag's message ("1.0.0 First release").
# Notes: GitHub's generated notes, which end in a Full Changelog link to the commits since the last release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The checkout may hold the tag without its message, so fetch the tag itself.
          git fetch --force --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          title="${TAG#v}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${TAG}")"
            [ -n "$subject" ] && title="${title} ${subject}"
          fi
          gh release create "$TAG" --verify-tag --title "$title" --generate-notes
